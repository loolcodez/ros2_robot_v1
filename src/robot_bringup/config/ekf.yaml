ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    # Coordinations
    map_frame: map              # World coordination (global)
    odom_frame: odom            # EKF:n calculated improved odometry coordination
    base_link_frame: base_link  # Robot's physical center point
    world_frame: odom           # Robot does bot have GPS, odom is therefore world's center point

    # Wheel odometry (From OdometerNode)
    odom0: /odom_wheel
    odom0_config: [false, false, false,  # x,  y,  z
                   false, false, false,  # r,  p,  y
                   true,  false, false,  # vx, vy, vz (Here we use only vx which is velocity in forward direction)
                   false, false, false,  # v_r, v_p, v_y
                   false, false, false]  # ax, ay, az
    odom0_differential: false

    # IMU-sensor (From DriverNode)
    imu0: /imu/data_raw
    imu0_config: [false, false, false,  # x,  y,  z
                  false, false, false,  # r,  p,  y
                  false, false, false,  # vx, vy, vz
                  false, false, true,   # v_r, v_p, v_y (Here we use only v_y which is turning speed)
                  true,  false, false]  # ax, ay, az (Here we use only forward direction acceleration)
    imu0_differential: false
